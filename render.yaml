services:
  - type: web
    name: berlin-x-panel
    runtime: python
    buildCommand: "python --version"
    startCommand: "python server.py"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: MAX_APK_MB
        value: "150"
      - key: DATA_DIR
        value: "/var/data"
