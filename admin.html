<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BERLIN X — Admin</title>
<style>
:root{--bg:#07090d;--card:#10151e;--line:#273146;--text:#f6f8fb;--muted:#929eb0;--pink:#ff4d7d;--green:#50e3aa;--red:#ff6e84}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 0 0,#211125,transparent 40%),radial-gradient(circle at 100% 0,#15233c,transparent 42%),var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}.hidden{display:none!important}.shell{width:min(1400px,100%);margin:auto;padding:20px}.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.brand{font-weight:900;letter-spacing:.08em}.muted{color:var(--muted)}.card{background:#10151eee;border:1px solid var(--line);border-radius:22px;box-shadow:0 30px 100px #0007;backdrop-filter:blur(18px)}.login{width:min(440px,100%);margin:10vh auto;padding:28px}.login h1{margin:0 0 8px}.field{margin:14px 0}.field label{display:block;font-size:13px;color:#cbd3df;margin-bottom:7px}.field input{width:100%;padding:13px 14px;background:#090d14;border:1px solid #2a354b;border-radius:12px;color:#fff;outline:none}.primary,.danger,.ghost{border:0;border-radius:11px;padding:11px 14px;cursor:pointer;font-weight:800}.primary{background:linear-gradient(135deg,var(--pink),#ff8c6b);color:#fff}.danger{background:#4a1720;color:#ff9bac}.ghost{background:#171e2a;color:#d6dcea;border:1px solid #2a3549}.login .primary{width:100%;margin-top:6px}.err{color:var(--red);font-size:13px;margin-top:12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}.stat{padding:18px}.stat b{display:block;font-size:26px;margin-top:5px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.search{flex:1;min-width:220px;background:#0b1018;border:1px solid #29354b;color:#fff;padding:12px 14px;border-radius:12px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:1120px}.table th,.table td{text-align:left;padding:13px 14px;border-top:1px solid #202a3b;vertical-align:top}.table th{color:#8e9aad;font-size:12px;text-transform:uppercase}.appname{font-weight:800}.pill{display:inline-flex;padding:5px 8px;border-radius:999px;background:#143328;color:#69e6b2;font-size:11px}.meta{font-size:12px;color:#8f9bae;line-height:1.5;margin-top:4px}.code{font-family:ui-monospace,monospace;font-size:11px;word-break:break-all;color:#b9c4d5;max-width:330px}.actions{display:flex;gap:7px;flex-wrap:wrap}.head{padding:20px}.empty{padding:40px;text-align:center;color:var(--muted)}.toast{position:fixed;right:18px;bottom:18px;background:#151d2a;border:1px solid #31405a;border-radius:13px;padding:13px 15px;box-shadow:0 15px 50px #0008}@media(max-width:700px){.stats{grid-template-columns:1fr}.shell{padding:12px}}
</style></head><body>
<div id="loginView" class="shell"><div class="login card"><h1>Admin Console</h1><p class="muted">BERLIN X PANEL</p><div class="field"><label>Username</label><input id="user" autocomplete="username"></div><div class="field"><label>Password</label><input id="pass" type="password" autocomplete="current-password"></div><button class="primary" id="login">Sign in</button><div id="loginErr" class="err"></div></div></div>
<div id="appView" class="shell hidden"><div class="bar"><div><div class="brand">BERLIN X / ADMIN</div><div class="muted">App registry & APK storage</div></div><div><a class="ghost" href="/submit.html" style="text-decoration:none">User Portal</a> <button class="ghost" id="logout">Logout</button></div></div>
<div class="stats"><div class="card stat"><span class="muted">Registered Apps</span><b id="total">0</b></div><div class="card stat"><span class="muted">Apps with APK</span><b id="withApk">0</b></div><div class="card stat"><span class="muted">APK Storage</span><b id="bytes">0 B</b></div></div>
<section class="card"><div class="head"><div class="toolbar"><input id="search" class="search" placeholder="Search app, owner, email or Firebase project…"><button class="primary" id="refresh">Refresh</button></div></div><div id="tableWrap" class="table-wrap"></div></section></div><div id="toast" class="toast hidden"></div>
<script>
const $=s=>document.querySelector(s);function toast(t){let x=$('#toast');x.textContent=t;x.classList.remove('hidden');setTimeout(()=>x.classList.add('hidden'),2800)}
async function api(u,o={}){let r=await fetch(u,o),j={};try{j=await r.json()}catch{}if(r.status===401){showLogin();throw Error('Session expired')}if(!r.ok||j.ok===false)throw Error(j.error||'Request failed');return j}
function showLogin(){$('#loginView').classList.remove('hidden');$('#appView').classList.add('hidden')}function showApp(){$('#loginView').classList.add('hidden');$('#appView').classList.remove('hidden');load()}
$('#login').onclick=async()=>{let e=$('#loginErr');e.textContent='';try{await api('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('#user').value,password:$('#pass').value})});showApp()}catch(x){e.textContent=x.message}}
$('#logout').onclick=async()=>{await api('/api/admin/logout',{method:'POST'}).catch(()=>{});showLogin()};$('#refresh').onclick=load;$('#search').addEventListener('input',load);
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]) )}function size(n){n=Number(n||0);if(n<1024)return n+' B';if(n<1048576)return(n/1024).toFixed(1)+' KB';if(n<1073741824)return(n/1048576).toFixed(1)+' MB';return(n/1073741824).toFixed(2)+' GB'}
async function load(){try{let q=encodeURIComponent($('#search').value.trim());let [a,s]=await Promise.all([api('/api/apps?q='+q),api('/api/admin/stats')]);$('#total').textContent=s.total;$('#withApk').textContent=s.with_apk;$('#bytes').textContent=size(s.apk_bytes);let rows=a.apps||[];if(!rows.length){$('#tableWrap').innerHTML='<div class="empty">No registered apps yet.</div>';return}$('#tableWrap').innerHTML='<table class="table"><thead><tr><th>App</th><th>Owner</th><th>Firebase</th><th>APK</th><th>Created</th><th>Actions</th></tr></thead><tbody>'+rows.map(r=>`<tr><td><div class="appname">${esc(r.app_name)}</div><span class="pill">${esc(r.status)}</span></td><td>${esc(r.owner_name)}<div class="meta">${esc(r.owner_email)}</div></td><td><div>${esc(r.firebase_project_id||'—')}</div><div class="code">${esc(r.firebase_database_url||r.firebase_auth_domain||'')}</div><div class="meta">App ID: ${esc(r.firebase_app_id||'—')}</div></td><td>${r.apk_stored_name?`<b>${esc(r.apk_original_name)}</b><div class="meta">${size(r.apk_size)} · SHA-256</div><div class="code">${esc(r.apk_sha256)}</div>`:'—'}</td><td>${esc(r.created_at)}</td><td class="actions">${r.apk_stored_name?`<button class="ghost" onclick="downloadApk(${r.id})">Download APK</button>`:''}<button class="danger" onclick="removeApp(${r.id})">Delete</button></td></tr>`).join('')+'</tbody></table>'}catch(e){toast(e.message)}}
async function removeApp(id){if(!confirm('Delete this app record and its APK?'))return;try{await api('/api/apps/'+id+'/delete',{method:'DELETE'});toast('Deleted');load()}catch(e){toast(e.message)}}function downloadApk(id){location.href='/api/apk/'+id}showLogin();
</script></body></html>
